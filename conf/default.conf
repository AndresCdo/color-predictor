server {
    listen       3000;
    server_name  localhost;
    absolute_redirect off;
    root         /usr/share/nginx/html;
    index        index.html;

    location = / {
        return 302 /color-predictor/;
    }

    location /color-predictor/ {
        try_files $uri $uri.html $uri/ =404;
    }
}
