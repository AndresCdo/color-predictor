name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Build jobs only need read access; deployment permissions are scoped below.
permissions:
  contents: read

# Separate PR checks from master deployments and cancel stale runs.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build Next.js static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Build (static export)
        run: npm run lint && npm test && npm run build
        working-directory: app

      - name: Audit production dependencies
        run: npm audit --omit=dev
        working-directory: app

      - name: Build and smoke-test container
        run: |
          docker build -t color-predictor-check .
          docker run -d --name color-predictor-check -p 127.0.0.1:3000:3000 color-predictor-check
          trap 'docker rm -f color-predictor-check' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/color-predictor/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # next build with `output: 'export'` writes to app/out/
          path: app/out

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
